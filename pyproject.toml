[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccfraud"
version = "0.1.0"
description = "Credit-card fraud detection on the ULB dataset: leakage-free CV, calibrated probabilities, cost-aware threshold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.4,<1.6",
    "imbalanced-learn>=0.12,<0.13",
    "xgboost>=2.0,<3",
    "lightgbm>=4.3,<5",
    "pandas>=2.1,<2.3",
    "numpy>=1.26,<2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ccfraud-train = "ccfraud.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["ccfraud"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
